<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typing Speed Tester</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem;
    background: #0d1117;
    color: #e6edf3;
    font-family: "Fira Code", Consolas, monospace;
  }
  main { max-width: 760px; margin: 0 auto; }
  h1 { margin: 0 0 0.25rem; font-size: 1.6rem; }
  h1 span { color: #2dd4bf; }
  .sub { color: #8b949e; margin: 0 0 1.5rem; font-size: 0.9rem; }

  .stats { display: flex; gap: 0.75rem; margin-bottom: 1rem; }
  .stat {
    flex: 1;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 0.6rem 0.8rem;
  }
  .stat small { display: block; color: #8b949e; font-size: 0.75rem; }
  .stat strong { font-size: 1.4rem; color: #2dd4bf; }

  .controls { display: flex; gap: 0.5rem; margin-bottom: 1rem; align-items: center; }
  select, button {
    background: #161b22;
    color: #e6edf3;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 0.45rem 0.8rem;
    font: inherit;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: #2dd4bf; }

  .text {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 1rem;
    height: 8.5rem;
    overflow: hidden;
    line-height: 1.9;
    font-size: 1.1rem;
    color: #6e7681;
    white-space: pre-wrap;
  }
  .text .correct { color: #2dd4bf; }
  .text .wrong { color: #f85149; background: rgba(248, 81, 73, 0.15); }
  .text .current { border-left: 2px solid #2dd4bf; margin-left: -2px; }

  textarea {
    width: 100%;
    height: 4.5rem;
    margin-top: 1rem;
    background: #0d1117;
    color: #e6edf3;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 0.7rem;
    font: inherit;
    resize: none;
  }
  textarea:focus { outline: none; border-color: #2dd4bf; }

  .result {
    margin-top: 1rem;
    padding: 0.8rem 1rem;
    border-radius: 8px;
    background: rgba(45, 212, 191, 0.1);
    border: 1px solid #2dd4bf;
    display: none;
  }

  h2 { font-size: 1.1rem; margin: 2rem 0 0.5rem; display: flex; justify-content: space-between; align-items: center; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.45rem 0.5rem; border-bottom: 1px solid #21262d; }
  th { color: #8b949e; font-weight: normal; }
  .empty { color: #8b949e; font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <h1>Typing Speed <span>Tester</span></h1>
  <p class="sub">The timer starts when you type your first letter.</p>

  <div class="stats">
    <div class="stat"><small>Time left</small><strong id="time">30</strong></div>
    <div class="stat"><small>WPM</small><strong id="wpm">0</strong></div>
    <div class="stat"><small>Accuracy</small><strong id="accuracy">100%</strong></div>
  </div>

  <div class="controls">
    <select id="duration">
      <option value="15">15 seconds</option>
      <option value="30" selected>30 seconds</option>
      <option value="60">60 seconds</option>
    </select>
    <button id="restart">New test</button>
  </div>

  <div class="text" id="text"></div>
  <textarea id="input" placeholder="Start typing here..." spellcheck="false" autocomplete="off"></textarea>

  <div class="result" id="result"></div>

  <h2>Previous scores <button id="clear">Clear</button></h2>
  <div id="history"></div>
</main>

<script>
const passages = [
  "Programming is the art of telling a computer exactly what to do, one small step at a time.",
  "A good developer reads more code than they write and learns something new from every bug they fix.",
  "Practice makes progress. Type a little every day and your speed will rise without you noticing.",
  "Every large project starts with a single file, a blank screen and a simple idea worth building.",
  "Clean code is easy to read, easy to change and easy to explain to the next person who opens it.",
  "Break big problems into small pieces, solve each piece, and then put them back together again."
];

const SCORE_KEY = "typingScores";

const textEl = document.getElementById("text");
const inputEl = document.getElementById("input");
const timeEl = document.getElementById("time");
const wpmEl = document.getElementById("wpm");
const accuracyEl = document.getElementById("accuracy");
const resultEl = document.getElementById("result");
const historyEl = document.getElementById("history");
const durationEl = document.getElementById("duration");

let target = "";
let duration = 30;
let startTime = null;
let timerId = null;
let finished = false;

function shuffle(list) {
  const copy = list.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function newTest() {
  clearInterval(timerId);
  startTime = null;
  finished = false;
  duration = Number(durationEl.value);

  // all passages joined so a fast typer never runs out of text
  target = shuffle(passages).join(" ");
  textEl.innerHTML = target
    .split("")
    .map(function (c) { return "<span>" + c + "</span>"; })
    .join("");
  textEl.scrollTop = 0;
  textEl.children[0].classList.add("current");

  inputEl.value = "";
  inputEl.disabled = false;
  inputEl.focus();

  timeEl.textContent = duration;
  wpmEl.textContent = "0";
  accuracyEl.textContent = "100%";
  resultEl.style.display = "none";
}

function countCorrect(typed) {
  let correct = 0;
  for (let i = 0; i < typed.length; i++) {
    if (typed[i] === target[i]) correct++;
  }
  return correct;
}

function getStats(elapsedSeconds) {
  const typed = inputEl.value;
  const correct = countCorrect(typed);
  const minutes = Math.max(elapsedSeconds, 1) / 60;
  return {
    wpm: Math.round(correct / 5 / minutes),
    accuracy: typed.length === 0 ? 100 : Math.round((correct / typed.length) * 100)
  };
}

function updateLetters() {
  const typed = inputEl.value;
  const spans = textEl.children;
  for (let i = 0; i < spans.length; i++) {
    spans[i].className = "";
    if (i < typed.length) {
      spans[i].className = typed[i] === target[i] ? "correct" : "wrong";
    } else if (i === typed.length) {
      spans[i].className = "current";
      spans[i].scrollIntoView({ block: "nearest" });
    }
  }
}

function tick() {
  const elapsed = (Date.now() - startTime) / 1000;
  const left = Math.max(0, duration - elapsed);
  timeEl.textContent = Math.ceil(left);

  const stats = getStats(elapsed);
  wpmEl.textContent = stats.wpm;
  accuracyEl.textContent = stats.accuracy + "%";

  if (left <= 0) finish();
}

function finish() {
  if (finished) return;
  finished = true;
  clearInterval(timerId);
  inputEl.disabled = true;

  const elapsed = Math.min((Date.now() - startTime) / 1000, duration);
  const stats = getStats(elapsed);
  wpmEl.textContent = stats.wpm;
  accuracyEl.textContent = stats.accuracy + "%";
  timeEl.textContent = "0";

  resultEl.textContent = "Done! " + stats.wpm + " WPM with " + stats.accuracy + "% accuracy.";
  resultEl.style.display = "block";

  saveScore({
    wpm: stats.wpm,
    accuracy: stats.accuracy,
    seconds: duration,
    date: new Date().toLocaleDateString()
  });
  showHistory();
}

function loadScores() {
  try {
    return JSON.parse(localStorage.getItem(SCORE_KEY)) || [];
  } catch (error) {
    return [];
  }
}

function saveScore(score) {
  const scores = loadScores();
  scores.unshift(score);
  try {
    localStorage.setItem(SCORE_KEY, JSON.stringify(scores.slice(0, 10)));
  } catch (error) {
    console.log("Could not save score");
  }
}

function showHistory() {
  const scores = loadScores();
  if (scores.length === 0) {
    historyEl.innerHTML = '<p class="empty">No scores yet. Finish a test to see it here.</p>';
    return;
  }

  let best = 0;
  scores.forEach(function (s) { if (s.wpm > best) best = s.wpm; });

  let rows = "";
  scores.forEach(function (s) {
    rows += "<tr><td>" + s.date + "</td><td>" + s.seconds + "s</td><td>" +
      s.wpm + (s.wpm === best ? " (best)" : "") + "</td><td>" + s.accuracy + "%</td></tr>";
  });
  historyEl.innerHTML =
    "<table><tr><th>Date</th><th>Length</th><th>WPM</th><th>Accuracy</th></tr>" + rows + "</table>";
}

inputEl.addEventListener("input", function () {
  if (finished) return;
  if (startTime === null) {
    startTime = Date.now();
    timerId = setInterval(tick, 100);
  }
  updateLetters();
  if (inputEl.value.length >= target.length) finish();
});

// no pasting the text in
inputEl.addEventListener("paste", function (e) { e.preventDefault(); });

textEl.addEventListener("click", function () { inputEl.focus(); });
document.getElementById("restart").addEventListener("click", newTest);
durationEl.addEventListener("change", newTest);

document.getElementById("clear").addEventListener("click", function () {
  try {
    localStorage.removeItem(SCORE_KEY);
  } catch (error) {
    console.log("Could not clear scores");
  }
  showHistory();
});

newTest();
showHistory();
</script>
</body>
</html>
